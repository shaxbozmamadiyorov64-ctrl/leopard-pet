name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'LEOPARD_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LeopardPet"
          include(":app")
          LEOPARD_EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'LEOPARD_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          LEOPARD_EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'LEOPARD_EOF'
          org.gradle.jvmargs=-Xmx2g
          LEOPARD_EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'LEOPARD_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.leopardpet"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.leopardpet"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          LEOPARD_EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'LEOPARD_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Леопард"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".ChatActivity" android:exported="false"
                      android:windowSoftInputMode="adjustResize" />
                  <service android:name=".OverlayService" android:exported="false" />
              </application>
          </manifest>
          LEOPARD_EOF
          mkdir -p $(dirname app/src/main/java/com/leopardpet/PetView.kt)
          cat > app/src/main/java/com/leopardpet/PetView.kt <<'LEOPARD_EOF'
          package com.leopardpet

          import android.content.Context
          import android.graphics.*
          import android.os.SystemClock
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.*

          class PetView(ctx: Context) : View(ctx) {
              enum class Mood { HAPPY, CALM, TIRED, SLEEP, ALERT, JOY }

              var mood = Mood.CALM
              var expand = 0f
              var line1 = ""
              var line2 = ""
              var line3 = ""
              var badge = ""
              var onTap: () -> Unit = {}
              var onDouble: () -> Unit = {}

              private val d = resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val t0 = SystemClock.uptimeMillis()
              private var purrUntil = 0L
              private val tick = object : Runnable {
                  override fun run() { invalidate(); postDelayed(this, 40) }
              }
              private val gd = GestureDetector(ctx, object : GestureDetector.SimpleOnGestureListener() {
                  override fun onDown(e: MotionEvent): Boolean = true
                  override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                      purrUntil = SystemClock.uptimeMillis() + 2500; onTap(); return true
                  }
                  override fun onDoubleTap(e: MotionEvent): Boolean { onDouble(); return true }
              })

              override fun onAttachedToWindow() { super.onAttachedToWindow(); post(tick) }
              override fun onDetachedFromWindow() { removeCallbacks(tick); super.onDetachedFromWindow() }
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  gd.onTouchEvent(e)
                  if (e.actionMasked == MotionEvent.ACTION_MOVE) purrUntil = SystemClock.uptimeMillis() + 1500
                  return true
              }

              private fun lerp(a: Float, b: Float, t: Float) = a + (b - a) * t

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val t = (SystemClock.uptimeMillis() - t0) / 1000f
                  val e = expand.coerceIn(0f, 1f)
                  p.reset(); p.isAntiAlias = true
                  val rad = min(h / 2f, 30f * d)
                  p.color = Color.BLACK
                  c.drawRoundRect(0f, 0f, w, h, rad, rad, p)
                  p.style = Paint.Style.STROKE; p.strokeWidth = d; p.color = 0x33FFFFFF
                  c.drawRoundRect(d / 2, d / 2, w - d / 2, h - d / 2, rad, rad, p)

                  val r = lerp(13f * d, 29f * d, e)
                  val padR = if (badge.isNotEmpty()) 24f * d else 6f * d
                  val lo = r * 1.35f
                  val hi = w - padR - r * 1.35f
                  val wander = if (mood == Mood.SLEEP) 0f else sin(t * 0.7f)
                  val cxC = (lo + hi) / 2f + wander * (hi - lo) / 2f
                  val cx = lerp(cxC, 46f * d, e)
                  val moving = mood != Mood.SLEEP && mood != Mood.ALERT && e < .5f
                  val face = if (moving) cos(t * 0.7f).sign else 0f
                  drawLeopard(c, cx, h / 2f, r, face, t, moving)

                  if (e > .55f) {
                      val a = ((e - .55f) / .45f).coerceIn(0f, 1f)
                      val x = 92f * d
                      val mw = w - x - 14f * d
                      p.style = Paint.Style.FILL
                      p.typeface = Typeface.DEFAULT_BOLD
                      txt(c, line1, x, h * .36f, mw, 15f, 0xFFFFFFFF.toInt(), a)
                      p.typeface = Typeface.DEFAULT
                      txt(c, line2, x, h * .58f, mw, 13f, 0xFFBBBBBB.toInt(), a)
                      txt(c, line3, x, h * .80f, mw, 11f, 0xFFE8B04A.toInt(), a)
                  }
                  if (badge.isNotEmpty() && e < .5f) {
                      p.reset(); p.isAntiAlias = true
                      p.style = Paint.Style.FILL; p.textSize = 13f * d; p.color = Color.WHITE
                      p.alpha = (255 * (1f - e * 2f)).toInt()
                      c.drawText(badge, w - 22f * d, h / 2f + 5f * d + sin(t * 4f) * d, p)
                  }
              }

              private fun txt(c: Canvas, s: String, x: Float, y: Float, maxW: Float, sp: Float, col: Int, a: Float) {
                  var size = sp * d
                  p.textSize = size
                  while (p.measureText(s) > maxW && size > 8f * d) { size -= d / 2f; p.textSize = size }
                  p.color = col
                  p.alpha = (a * 255).toInt()
                  c.drawText(s, x, y, p)
              }

              private fun drawLeopard(c: Canvas, cx: Float, cy0: Float, r: Float, face: Float, t: Float, walking: Boolean) {
                  val purr = SystemClock.uptimeMillis() < purrUntil
                  val sleep = mood == Mood.SLEEP
                  val tired = mood == Mood.TIRED
                  val alert = mood == Mood.ALERT
                  val happyEyes = purr || (mood == Mood.HAPPY && (t % 9f) > 7.5f) || mood == Mood.JOY
                  val bob = if (walking) abs(sin(t * 5f)) * .07f * r else sin(t * 2f) * .02f * r
                  val ink = 0xFF1B1008.toInt()
                  c.save()
                  c.translate(cx, cy0 - bob)

                  p.style = Paint.Style.FILL; p.shader = null
                  p.color = 0x40000000
                  c.drawOval(-.8f * r, .95f * r + bob, .8f * r, 1.12f * r + bob, p)

                  for (k in 0..1) {
                      val s = if (k == 0) -1f else 1f
                      val lift = if (walking) max(0f, sin(t * 10f + k * PI.toFloat())) * .22f * r else 0f
                      p.style = Paint.Style.FILL; p.color = 0xFFE0A33C.toInt()
                      c.drawOval(s * .5f * r - .26f * r, .72f * r - lift, s * .5f * r + .26f * r, 1.05f * r - lift, p)
                      p.color = ink
                      for (j in -1..1) c.drawCircle(s * .5f * r + j * .11f * r, .97f * r - lift, .035f * r, p)
                  }

                  for (k in 0..1) {
                      val s = if (k == 0) -1f else 1f
                      val tw = if (!alert && !sleep && ((t * (1f + k * .3f)) % 6f) > 5.8f) sin(t * 60f) * 10f else 0f
                      c.save()
                      c.translate(s * .62f * r, -.7f * r)
                      c.rotate(s * (if (alert) 55f else 8f) + tw)
                      p.style = Paint.Style.FILL; p.color = 0xFFD9962F.toInt()
                      c.drawOval(-.34f * r, -.38f * r, .34f * r, .3f * r, p)
                      p.color = 0xFFEBA6A0.toInt()
                      c.drawOval(-.19f * r, -.22f * r, .19f * r, .2f * r, p)
                      p.style = Paint.Style.STROKE; p.strokeWidth = .06f * r; p.color = ink
                      c.drawArc(-.34f * r, -.38f * r, .34f * r, .3f * r, 200f, 140f, false, p)
                      c.restore()
                  }

                  p.style = Paint.Style.FILL
                  p.shader = RadialGradient(-.3f * r, -.4f * r, 1.5f * r,
                      intArrayOf(0xFFFFE7A8.toInt(), 0xFFEDB24C.toInt(), 0xFFC4851F.toInt()),
                      floatArrayOf(0f, .55f, 1f), Shader.TileMode.CLAMP)
                  c.drawOval(-r, -.9f * r, r, .9f * r, p)
                  c.drawCircle(-.78f * r, .3f * r, .3f * r, p)
                  c.drawCircle(.78f * r, .3f * r, .3f * r, p)
                  p.shader = null

                  p.color = ink
                  for (x in floatArrayOf(-.3f, 0f, .3f)) c.drawCircle(x * r, (-.62f + abs(x) * .3f) * r, .06f * r, p)
                  for (s in floatArrayOf(-1f, 1f)) {
                      val mx = s * .78f * r
                      val my = .12f * r
                      p.style = Paint.Style.FILL; p.color = 0x55A86A20
                      c.drawCircle(mx, my, .15f * r, p)
                      p.style = Paint.Style.STROKE; p.strokeWidth = .05f * r; p.color = ink
                      for (i in 0..4) c.drawArc(mx - .15f * r, my - .15f * r, mx + .15f * r, my + .15f * r, i * 72f + 6f, 50f, false, p)
                  }

                  p.style = Paint.Style.FILL
                  p.shader = LinearGradient(0f, .1f * r, 0f, .8f * r, 0xFFFFFFFF.toInt(), 0xFFF1DDB0.toInt(), Shader.TileMode.CLAMP)
                  c.drawOval(-.5f * r, .08f * r, .5f * r, .8f * r, p)
                  p.shader = null
                  p.color = 0xFF5A3535.toInt()
                  val np = Path()
                  np.moveTo(-.12f * r, .2f * r); np.quadTo(0f, .14f * r, .12f * r, .2f * r)
                  np.quadTo(.08f * r, .32f * r, 0f, .35f * r); np.quadTo(-.08f * r, .32f * r, -.12f * r, .2f * r)
                  c.drawPath(np, p)
                  p.style = Paint.Style.STROKE; p.strokeWidth = .05f * r; p.strokeCap = Paint.Cap.ROUND; p.color = 0xFF4A2E2E.toInt()
                  val mp = Path()
                  mp.moveTo(0f, .35f * r); mp.lineTo(0f, .45f * r)
                  mp.moveTo(0f, .45f * r); mp.quadTo(-.12f * r, .58f * r, -.26f * r, .46f * r)
                  mp.moveTo(0f, .45f * r); mp.quadTo(.12f * r, .58f * r, .26f * r, .46f * r)
                  c.drawPath(mp, p)

                  p.style = Paint.Style.FILL; p.color = 0x66FF7F96
                  c.drawCircle(-.62f * r, .3f * r, .13f * r, p)
                  c.drawCircle(.62f * r, .3f * r, .13f * r, p)

                  val bp = t % 4.3f
                  var open = if (bp > 4.15f) abs((bp - 4.225f) / .075f).coerceIn(0f, 1f) else 1f
                  if (tired) open *= .55f
                  val look = face * .06f * r
                  for (s in floatArrayOf(-1f, 1f)) {
                      val ex = s * .4f * r + look
                      val ey = -.08f * r
                      if (sleep || happyEyes) {
                          p.style = Paint.Style.STROKE; p.strokeWidth = .075f * r; p.color = ink; p.strokeCap = Paint.Cap.ROUND
                          c.drawArc(ex - .15f * r, ey - .1f * r, ex + .15f * r, ey + .14f * r, if (sleep) 20f else 200f, 140f, false, p)
                      } else {
                          val ew = if (alert) .17f else .145f
                          val eh = (if (alert) .24f else .2f) * max(open, .08f)
                          p.style = Paint.Style.FILL; p.color = ink
                          c.drawOval(ex - ew * r, ey - eh * r, ex + ew * r, ey + eh * r, p)
                          if (open > .5f) {
                              p.color = Color.WHITE
                              c.drawCircle(ex + .05f * r, ey - .08f * r, .055f * r, p)
                              c.drawCircle(ex - .05f * r, ey + .07f * r, .03f * r, p)
                          }
                      }
                  }

                  p.style = Paint.Style.FILL
                  if (sleep) {
                      p.color = 0xCCFFFFFF.toInt(); p.textSize = .6f * r
                      c.drawText(if ((t % 2f) < 1f) "z" else "Z", .85f * r, -.5f * r - (t % 1f) * .3f * r, p)
                  }
                  if (purr) {
                      p.color = 0xFFFF7F96.toInt(); p.textSize = .5f * r
                      c.drawText("♥", -1.1f * r, -.4f * r - (t % 1f) * .6f * r, p)
                  }
                  if (mood == Mood.JOY || mood == Mood.HAPPY) {
                      p.color = 0xFFFFF3B0.toInt(); p.textSize = .5f * r
                      c.drawText("✦", .95f * r, -.7f * r + sin(t * 3f) * .08f * r, p)
                  }
                  c.restore()
              }
          }
          LEOPARD_EOF
          mkdir -p $(dirname app/src/main/java/com/leopardpet/OverlayService.kt)
          cat > app/src/main/java/com/leopardpet/OverlayService.kt <<'LEOPARD_EOF'
          package com.leopardpet

          import android.animation.ValueAnimator
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.OvershootInterpolator

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var lp: WindowManager.LayoutParams
              private var pet: PetView? = null
              private val h = Handler(Looper.getMainLooper())
              private var level = 60
              private var prev = -1
              private var charging = false
              private var prevChg = false
              private var scene = 0
              private var sceneUntil = 0L
              private var open = false
              private var cur = 0f
              private var anim: ValueAnimator? = null
              private var pos = 1
              private var question = "Sen nima qilyapsan?"
              private var lastMood = ""

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()
              private val sw: Int get() = resources.displayMetrics.widthPixels

              override fun onBind(i: Intent?): IBinder? = null

              private val rcv = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) { battery(i) }
              }
              private val collapse = Runnable { open = false; expand(false) }
              private val loop = object : Runnable {
                  override fun run() { refresh(); h.postDelayed(this, 1000) }
              }

              private fun notif(): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("pet", "Леопард", NotificationManager.IMPORTANCE_MIN))
                  return Notification.Builder(this, "pet")
                      .setContentTitle("Леопард живёт на экране")
                      .setSmallIcon(android.R.drawable.star_on).build()
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  startForeground(1, notif())
                  if (pet == null) {
                      if (!Settings.canDrawOverlays(this)) { stopSelf(); return START_NOT_STICKY }
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      pos = getSharedPreferences("pet", 0).getInt("pos", 1)
                      val v = PetView(this)
                      pet = v
                      v.onTap = { onTap() }
                      v.onDouble = { openChat() }
                      lp = WindowManager.LayoutParams(
                          dp(104), dp(36), WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT)
                      lp.gravity = Gravity.TOP or (if (pos == 0) Gravity.START else if (pos == 2) Gravity.END else Gravity.CENTER_HORIZONTAL)
                      lp.y = topY()
                      layout(0f)
                      wm.addView(v, lp)
                      registerReceiver(rcv, IntentFilter(Intent.ACTION_BATTERY_CHANGED))?.let { battery(it) }
                      h.post(loop)
                  }
                  return START_STICKY
              }

              private fun topY(): Int {
                  val id = resources.getIdentifier("status_bar_height", "dimen", "android")
                  val sb = if (id > 0) resources.getDimensionPixelSize(id) else dp(24)
                  return maxOf(dp(2), (sb - dp(36)) / 2)
              }

              private fun layout(e: Float) {
                  val w = (dp(104) + (dp(250) - dp(104)) * e).toInt()
                  val hh = (dp(36) + (dp(96) - dp(36)) * e).toInt()
                  lp.width = w
                  lp.height = hh
                  lp.x = if (pos == 0) minOf(dp(96), sw - w - dp(4)) else if (pos == 2) dp(10) else 0
                  pet?.let { v ->
                      v.expand = e
                      try { if (v.isAttachedToWindow) wm.updateViewLayout(v, lp) } catch (ex: Exception) {}
                  }
              }

              private fun expand(on: Boolean) {
                  anim?.cancel()
                  val a = ValueAnimator.ofFloat(cur, if (on) 1f else 0f)
                  a.duration = 300
                  a.interpolator = if (on) OvershootInterpolator(1.0f) else DecelerateInterpolator()
                  a.addUpdateListener { cur = it.animatedValue as Float; layout(cur) }
                  a.start()
                  anim = a
              }

              private fun showFor(ms: Long) {
                  open = true
                  expand(true)
                  h.removeCallbacks(collapse)
                  h.postDelayed(collapse, ms)
              }

              private fun onTap() {
                  if (!open) {
                      question = ask()
                      refresh()
                      showFor(5000)
                  } else {
                      openChat()
                      h.removeCallbacks(collapse)
                      collapse.run()
                  }
              }

              private fun openChat() {
                  startActivity(Intent(this, ChatActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }

              private fun ask(): String = when (pet?.mood) {
                  PetView.Mood.SLEEP -> "zzz…"
                  PetView.Mood.TIRED -> "Charchadim… Sen-chi?"
                  PetView.Mood.ALERT -> "Ehtiyot bo’l!"
                  PetView.Mood.HAPPY, PetView.Mood.JOY -> listOf("O’ynaymizmi?", "Sen nima qilyapsan?").random()
                  else -> listOf("Sen nima qilyapsan?", "Nima bilan bandsan?").random()
              }

              private fun battery(i: Intent) {
                  val lv = i.getIntExtra(BatteryManager.EXTRA_LEVEL, 50) * 100 / maxOf(1, i.getIntExtra(BatteryManager.EXTRA_SCALE, 100))
                  val st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                  charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val old = level
                  level = lv
                  if (prev >= 0) {
                      if (!charging && lv <= 20 && old > 20) startScene(1, 9000)
                      if (!charging && lv <= 10 && lv < old) startScene(2, 7000)
                      if (charging && !prevChg) startScene(4, 3500)
                      if (charging && lv >= 100 && old < 100) startScene(3, 9000)
                  }
                  prev = lv
                  prevChg = charging
                  refresh()
              }

              private fun startScene(k: Int, ms: Long) {
                  val now = SystemClock.uptimeMillis()
                  if (now < sceneUntil && k != 3) return
                  scene = k
                  sceneUntil = now + ms
                  refresh()
                  showFor(ms)
              }

              private fun refresh() {
                  val v = pet ?: return
                  if (SystemClock.uptimeMillis() >= sceneUntil) scene = 0
                  val low = !charging && level in 6..20
                  v.mood = when {
                      scene == 1 || scene == 2 -> PetView.Mood.ALERT
                      scene == 3 -> PetView.Mood.JOY
                      level <= 5 && !charging -> PetView.Mood.SLEEP
                      low -> PetView.Mood.ALERT
                      scene == 4 || level >= 80 -> PetView.Mood.HAPPY
                      level >= 50 || (charging && level >= 35) -> PetView.Mood.CALM
                      else -> PetView.Mood.TIRED
                  }
                  v.badge = when {
                      scene == 2 -> "🐻"
                      scene == 1 || low -> "🦉"
                      v.mood == PetView.Mood.SLEEP -> "💤"
                      charging -> "⚡"
                      else -> ""
                  }
                  v.line1 = when {
                      scene == 1 -> "Совы кружат!"
                      scene == 2 -> "Медведь пришёл!"
                      scene == 3 -> "100%! Ура! 🎉"
                      scene == 4 -> "Ой, зарядка! ⚡"
                      else -> when (v.mood) {
                          PetView.Mood.HAPPY, PetView.Mood.JOY -> "Радость"
                          PetView.Mood.CALM -> "Спокойствие"
                          PetView.Mood.TIRED -> "Устал"
                          PetView.Mood.SLEEP -> "Сплю…"
                          PetView.Mood.ALERT -> "Настороже"
                      }
                  }
                  v.line2 = "🔋 $level%" + if (charging) " ⚡" else ""
                  v.line3 = question
                  if (v.mood.name != lastMood) {
                      lastMood = v.mood.name
                      getSharedPreferences("pet", 0).edit().putString("mood", lastMood).apply()
                  }
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  try { unregisterReceiver(rcv) } catch (e: Exception) {}
                  pet?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  pet = null
                  super.onDestroy()
              }
          }
          LEOPARD_EOF
          mkdir -p $(dirname app/src/main/java/com/leopardpet/ChatActivity.kt)
          cat > app/src/main/java/com/leopardpet/ChatActivity.kt <<'LEOPARD_EOF'
          package com.leopardpet

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class ChatActivity : Activity() {
              private val dict: Map<String, String> = ("hello=salom;hi=salom;thank you=rahmat;thanks=rahmat;yes=ha;no=yo’q;please=iltimos;sorry=kechirasiz;goodbye=xayr;bye=xayr;how are you=qalaysiz;good morning=xayrli tong;good night=xayrli tun;i love you=seni sevaman;water=suv;bread=non;apple=olma;book=kitob;house=uy;home=uy;friend=do’st;mother=ona;father=ota;sister=opa;brother=aka;child=bola;man=erkak;woman=ayol;good=yaxshi;bad=yomon;big=katta;small=kichik;sun=quyosh;moon=oy;star=yulduz;day=kun;night=tun;morning=ertalab;evening=kechqurun;love=sevgi;cat=mushuk;dog=it;bird=qush;owl=boyqush;bear=ayiq;leopard=qoplon;tiger=yo’lbars;horse=ot;food=ovqat;eat=yemoq;drink=ichmoq;sleep=uxlamoq;go=bormoq;come=kelmoq;see=ko’rmoq;know=bilmoq;want=xohlamoq;play=o’ynamoq;run=yugurmoq;walk=yurmoq;read=o’qimoq;write=yozmoq;speak=gapirmoq;school=maktab;teacher=o’qituvchi;student=talaba;city=shahar;country=mamlakat;road=yo’l;car=mashina;phone=telefon;battery=batareya;charge=zaryad;tree=daraxt;flower=gul;river=daryo;mountain=tog’;sea=dengiz;red=qizil;blue=ko’k;green=yashil;white=oq;black=qora;yellow=sariq;one=bir;two=ikki;three=uch;four=to’rt;five=besh;six=olti;seven=yetti;eight=sakkiz;nine=to’qqiz;ten=o’n;today=bugun;tomorrow=ertaga;yesterday=kecha;tea=choy;milk=sut;meat=go’sht;fish=baliq;hand=qo’l;head=bosh;eye=ko’z;ear=quloq;tail=dum;paw=panja;name=ism;time=vaqt;work=ish;money=pul;happy=xursand;sad=xafa;tired=charchagan;hungry=och;cold=sovuq;hot=issiq;new=yangi;old=eski;beautiful=chiroyli;fast=tez;slow=sekin;i=men;you=sen;he=u;she=u;we=biz;they=ular;is=;are=;am=;the=;a=;what=nima;where=qayerda;who=kim;why=nega;when=qachon;my=mening;your=sening;with=bilan;and=va;but=lekin;very=juda;sky=osmon;earth=yer;forest=o’rmon;fire=olov;rain=yomg’ir;snow=qor;wind=shamol;family=oila;world=dunyo;heart=yurak")
                  .split(";").associate { val kv = it.split("=", limit = 2); kv[0] to kv[1] }
              private lateinit var log: LinearLayout
              private lateinit var sv: ScrollView

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(sb: Bundle?) {
                  super.onCreate(sb)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(0xFF111118.toInt())
                  root.setPadding(dp(12), dp(36), dp(12), dp(12))
                  val title = TextView(this)
                  title.text = "Словарь EN → UZ (офлайн, без ИИ)"
                  title.setTextColor(0xFFAAAAAA.toInt())
                  sv = ScrollView(this)
                  log = LinearLayout(this)
                  log.orientation = LinearLayout.VERTICAL
                  sv.addView(log)
                  val row = LinearLayout(this)
                  val et = EditText(this)
                  et.hint = "hello, water, friend…"
                  et.setTextColor(Color.WHITE)
                  et.setHintTextColor(0xFF777777.toInt())
                  et.isSingleLine = true
                  et.imeOptions = EditorInfo.IME_ACTION_SEND
                  val go = Button(this)
                  go.text = "→"
                  row.addView(et, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  row.addView(go)
                  root.addView(title)
                  root.addView(sv, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(row)
                  setContentView(root)

                  val mood = getSharedPreferences("pet", 0).getString("mood", "CALM")
                  add(when (mood) {
                      "SLEEP" -> "Uyqum keldi… zzz (Хочу спать…)"
                      "TIRED" -> "Charchadim… Sen nima qilyapsan? (Устал… А ты что делаешь?)"
                      "ALERT" -> "Ehtiyot bo’l! Atrofda xavf bor! (Осторожно! Вокруг опасность!)"
                      "HAPPY", "JOY" -> "Bugun juda xursandman! Sen nima qilyapsan? (Я так рад! Чем занят?)"
                      else -> "Tinchgina yuribman. Sen nima qilyapsan? (Спокойно гуляю. А ты чем занят?)"
                  }, false)

                  fun send() {
                      val q = et.text.toString().trim()
                      if (q.isEmpty()) return
                      et.setText("")
                      add(q, true)
                      val (s, un, n) = tr(q)
                      add(if (un == n) "Bu so’zni bilmayman 😿 (не знаю этого слова — пиши по-английски)"
                          else s.replaceFirstChar { it.uppercase() } + if (un > 0) "  (часть слов не нашёл)" else "", false)
                  }
                  go.setOnClickListener { send() }
                  et.setOnEditorActionListener { _, _, _ -> send(); true }
              }

              private fun tr(t: String): Triple<String, Int, Int> {
                  val w = t.lowercase().replace(Regex("[.,!?;:\"]"), " ").split(Regex("\\s+")).filter { it.isNotEmpty() }
                  val o = ArrayList<String>()
                  var un = 0
                  var i = 0
                  while (i < w.size) {
                      var ok = false
                      for (n in minOf(3, w.size - i) downTo 1) {
                          val v = dict[w.subList(i, i + n).joinToString(" ")]
                          if (v != null) { if (v.isNotEmpty()) o.add(v); i += n; ok = true; break }
                      }
                      if (!ok) { o.add(w[i]); un++; i++ }
                  }
                  return Triple(o.joinToString(" "), un, w.size)
              }

              private fun add(s: String, me: Boolean) {
                  val tv = TextView(this)
                  tv.text = s
                  tv.textSize = 16f
                  tv.setTextColor(if (me) 0xFF201808.toInt() else Color.WHITE)
                  tv.setPadding(dp(12), dp(8), dp(12), dp(8))
                  val bg = GradientDrawable()
                  bg.cornerRadius = dp(14).toFloat()
                  bg.setColor(if (me) 0xFFE8B04A.toInt() else 0xFF3A3040.toInt())
                  tv.background = bg
                  val lp = LinearLayout.LayoutParams(-2, -2)
                  lp.topMargin = dp(6)
                  lp.gravity = if (me) Gravity.END else Gravity.START
                  log.addView(tv, lp)
                  sv.post { sv.fullScroll(ScrollView.FOCUS_DOWN) }
              }
          }
          LEOPARD_EOF
          mkdir -p $(dirname app/src/main/java/com/leopardpet/MainActivity.kt)
          cat > app/src/main/java/com/leopardpet/MainActivity.kt <<'LEOPARD_EOF'
          package com.leopardpet

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var st: TextView

              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(sb: Bundle?) {
                  super.onCreate(sb)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(0xFF111118.toInt())
                  root.setPadding(dp(20), dp(48), dp(20), dp(20))
                  val title = TextView(this)
                  title.text = "🐆 Леопард"
                  title.textSize = 28f
                  title.setTextColor(Color.WHITE)
                  st = TextView(this)
                  st.setTextColor(0xFFE8B04A.toInt())
                  st.setPadding(0, dp(8), 0, dp(12))
                  root.addView(title)
                  root.addView(st)
                  fun btn(t: String, a: () -> Unit) {
                      val b = Button(this)
                      b.text = t
                      b.setOnClickListener { a() }
                      root.addView(b)
                  }
                  btn("1. Разрешить показ поверх других окон") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  btn("2. Запустить леопарда") { start() }
                  btn("Остановить") { stopService(Intent(this, OverlayService::class.java)) }
                  val label = TextView(this)
                  label.text = "Где показывать:"
                  label.setTextColor(0xFFAAAAAA.toInt())
                  label.setPadding(0, dp(12), 0, 0)
                  root.addView(label)
                  val row = LinearLayout(this)
                  listOf("Слева (у часов)" to 0, "По центру" to 1, "Справа" to 2).forEach { (n, v) ->
                      val b = Button(this)
                      b.text = n
                      b.setOnClickListener {
                          getSharedPreferences("pet", 0).edit().putInt("pos", v).apply()
                          start()
                      }
                      row.addView(b, LinearLayout.LayoutParams(0, -2, 1f))
                  }
                  root.addView(row)
                  btn("Открыть чат EN → UZ") { startActivity(Intent(this, ChatActivity::class.java)) }
                  setContentView(root)
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  st.text = if (Settings.canDrawOverlays(this)) "Разрешение есть ✓" else "Нужно разрешение «Поверх других окон»"
              }

              private fun start() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Сначала разрешите показ поверх других окон", Toast.LENGTH_LONG).show()
                      return
                  }
                  stopService(Intent(this, OverlayService::class.java))
                  startForegroundService(Intent(this, OverlayService::class.java))
              }
          }
          LEOPARD_EOF
